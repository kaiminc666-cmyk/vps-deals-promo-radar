name: Refresh verified offers
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".ilang/site.ilang"
      - "scraper.py"
      - "build.py"
      - "templates/**"
      - ".github/workflows/update.yml"
permissions:
  contents: write
concurrency:
  group: refresh-offers
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official sources
        run: python scraper.py
      - name: Build static pages
        run: python build.py
      - name: Commit changes when data or site changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json site/
          git diff --cached --quiet || git commit -m "Refresh verified VPS offers"
          git pull --rebase origin main
          git push

